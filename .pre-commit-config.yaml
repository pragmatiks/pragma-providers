repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        name: Ruff linter
        args: [--fix, --unsafe-fixes]
      - id: ruff-format
        name: Ruff formatter

  - repo: local
    hooks:
      - id: check-comments
        name: Enforce NO COMMENTS policy
        entry: python -m pragmatiks_lint.comments
        language: python
        language_version: python3.13
        additional_dependencies: ["pragmatiks-lint==0.7.0"]
        types: [python]
        pass_filenames: true
        stages: [pre-commit]
      - id: check-sources
        name: Reject sibling path overrides
        entry: python -m pragmatiks_lint.sources
        language: python
        language_version: python3.13
        additional_dependencies: ["pragmatiks-lint==0.7.0"]
        files: (^|/)(pyproject\.toml|package\.json|pnpm-workspace\.yaml)$
        pass_filenames: true
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: commitizen
        name: commitizen check
        entry: mise exec -- cz check --allow-abort --commit-msg-file
        language: system
        stages: [commit-msg]
