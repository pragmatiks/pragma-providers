[install]
description = "Install the pinned toolchain from mise.lock, every provider from uv.lock, and the git hooks"
extends = "bash"
run = [
  { task = "install:mise-ceiling" },
  "mise install",
  { task = "install:python" },
  { task = "install:hooks" },
]

["install:mise-ceiling"]
description = "Write the gitignored .miserc.toml that keeps mise in .claude/worktrees checkouts from loading the primary checkout's config"
file = "scripts/tasks/install_mise_ceiling.sh"

["install:hooks"]
description = "Install the git hooks, which run pre-commit through mise, into the shared hooks directory"
file = "scripts/tasks/install_hooks.sh"

[lock]
description = "Re-resolve the workspace lockfile and the publish tooling lockfile"
extends = "bash"
run = ["uv lock", "uv lock --project scripts/publish_tooling"]

["lock:toolchain"]
description = "Re-resolve mise.lock for macOS arm64 and Linux x64 without bumping any tool; needs mise at the min_version in mise.toml"
file = "scripts/tasks/lock_toolchain.sh"

[format]
description = "Format every provider with ruff"
depends = ["*:format"]

[check]
description = "Run every provider's check, each in its own environment of only its declared and transitive dependencies: ruff fixes, then ruff and ty must pass; and check the publish tooling lockfile"
depends = ["*:check", "check:tooling-lock"]

["check:tooling-lock"]
description = "Fail when scripts/publish_tooling/uv.lock does not match its pyproject.toml"
extends = "bash"
run = "uv lock --check --project scripts/publish_tooling"

["check:wheels"]
description = "Build every provider's wheel once as publishing builds it, then check each introspects and declares its embeds against that release set"
file = "scripts/tasks/check_wheels.sh"

["check:ci"]
description = "Run the CI gate: every provider's check, the pre-commit hooks on all files and the Pragmatiks lint rules; fails when any step rewrote a file"
extends = "bash"
run = [
  { task = "check:tree-snapshot" },
  { task = "check" },
  { task = "check:pre-commit" },
  { task = "check:lint" },
  { task = "check:tree-unchanged" },
]

["check:tree-snapshot"]
description = "Record the working tree, untracked files included, as the baseline check:tree-unchanged compares against"
hide = true
extends = "bash"
run = """
index="$(git rev-parse --git-path check-ci-index)"
cp "$(git rev-parse --git-path index)" "$index"
GIT_INDEX_FILE="$index" git add --all
GIT_INDEX_FILE="$index" git write-tree > "$(git rev-parse --git-path check-ci-tree)"
"""

["check:tree-unchanged"]
description = "Fail, showing the diff, when the working tree differs from the check:tree-snapshot baseline"
hide = true
extends = "bash"
run = """
index="$(git rev-parse --git-path check-ci-index)"
baseline="$(cat "$(git rev-parse --git-path check-ci-tree)")"
GIT_INDEX_FILE="$index" git add --all
current="$(GIT_INDEX_FILE="$index" git write-tree)"
if [ "$baseline" != "$current" ]; then
  echo "check:ci rewrote files; run mise run format and commit the result:" >&2
  git --no-pager diff --stat "$baseline" "$current" >&2
  git --no-pager diff "$baseline" "$current" >&2
  exit 1
fi
"""

["check:pre-commit"]
description = "Run every pre-commit stage hook on all files, as CI does"
extends = "bash"
run = "pre-commit run --all-files --show-diff-on-failure --hook-stage pre-commit"

["check:lint"]
description = "Run the Pragmatiks principle lint rules over the provider and script paths with the mise-pinned pragma CLI; blocking findings fail"
extends = "bash"
run = "pragma lint check packages scripts"

["check:floors"]
description = "Resolve the workspace without workspace sources, then introspect each provider installed with the lowest released sibling tags its floors allow"
run = [
  "scripts/tasks/check_floors.sh",
  "scripts/tasks/check_floor_wheels.sh",
]

["check:toolchain-scripts"]
description = "Fail when a shared toolchain script differs from the public repositories' copies on the branch named like the pull request's head branch, else main"
file = "scripts/tasks/check_toolchain_scripts.sh"

["check:mise-pins"]
description = "Fail when a jdx/mise-action step's version or sha256 differs from min_version and its runner's mise binary checksum"
file = "scripts/tasks/check_mise_pins.sh"
