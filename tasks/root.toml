[install]
description = "Install the pinned toolchain from mise.lock, every provider from uv.lock, and the git hooks"
extends = "bash"
run = [
  { task = "install:mise-ceiling" },
  "mise install",
  { task = "install:python" },
  { task = "install:hooks" },
]

["install:mise-ceiling"]
description = "Write the gitignored .miserc.toml that keeps mise in .claude/worktrees checkouts from loading the primary checkout's config"
file = "scripts/tasks/install_mise_ceiling.sh"

["install:hooks"]
description = "Install the pre-commit and commit-msg git hooks into the shared hooks directory"
file = "scripts/tasks/install_hooks.sh"

[lock]
description = "Re-resolve the workspace lockfile"
extends = "bash"
run = "uv lock"

["lock:toolchain"]
description = "Re-resolve mise.lock for macOS arm64 and Linux x64 without bumping any tool; needs mise at the min_version in mise.toml"
file = "scripts/tasks/lock_toolchain.sh"

[format]
description = "Format every provider with ruff"
depends = ["*:format"]

[check]
description = "Run every provider's check: ruff fixes, then ruff and ty must pass"
depends = ["*:check"]
