[changelog]
body = """
## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% set breaking = commits | filter(attribute="breaking", value=true) %}
{%- if breaking %}
### BREAKING CHANGE
{% for commit in breaking %}
- {{ commit.breaking_description }}
{%- endfor %}
{% endif %}
{%- for group, commits in commits | group_by(attribute="group") %}
{%- if group | striptags | trim %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message }}
{%- endfor %}
{% endif %}
{%- endfor %}

"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
protect_breaking_commits = true
sort_commits = "newest"
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Feat" },
    { message = "^fix", group = "<!-- 1 -->Fix" },
    { message = "^refactor", group = "<!-- 2 -->Refactor" },
    { message = "^perf", group = "<!-- 3 -->Perf" },
    { field = "breaking", pattern = "true", group = "<!-- 4 -->" },
]
