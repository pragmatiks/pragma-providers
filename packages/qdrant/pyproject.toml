[project]
name = "pragmatiks-qdrant-provider"
version = "8.1.0"
description = "Qdrant provider for Pragmatiks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pragmatiks-sdk>=15.0.0",
    "pragmatiks-kubernetes-provider>=2.0.1",
    "qdrant-client>=1.12.0",
]

authors = [
    { name = "Pragmatiks", email = "team@pragmatiks.io" },
]

[dependency-groups]
dev = [
    "ruff==0.16.8",
    "ty==0.0.63",
]

[project.entry-points."pragma.provider"]
qdrant = "qdrant_provider"

[tool.pragma]
# Provider metadata - used by the platform for discovery and deployment
provider = "qdrant"
package = "qdrant_provider"
display_name = "Qdrant Vector Database"
description = "Provision and manage Qdrant vector database instances and collections for similarity search and AI applications."
icon_url = "https://cdn.simpleicons.org/qdrant"
tags = ["vector-database", "search", "ai", "embeddings"]
entrypoint = ["python", "-m", "pragma_runtime.entrypoint"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "8.1.0"
version_files = ["pyproject.toml:^version"]
tag_format = "qdrant-v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"

[tool.ruff]
extend = "../../pyproject.toml"
line-length = 120

[tool.uv.build-backend]
module-name = "qdrant_provider"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"
