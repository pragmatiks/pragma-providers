[project]
name = "pragmatiks-kubernetes-provider"
version = "2.1.0"
description = "Deploy and manage Kubernetes resources including deployments, services, configmaps, secrets, and statefulsets."
keywords = ["kubernetes", "orchestration", "containers", "infrastructure"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pragmatiks-sdk>=16.0.0",
    "pragmatiks-gcp-provider>=7.0.0",
    "lightkube>=0.15.0",
    "google-auth>=2.30.0",
    "requests>=2.32.0",
]

authors = [
    { name = "Pragmatiks", email = "team@pragmatiks.io" },
]

[dependency-groups]
dev = [
    "ruff==0.16.8",
    "ty==0.0.63",
]

[project.entry-points."pragma.provider"]
kubernetes = "kubernetes_provider"

[tool.commitizen]
name = "cz_conventional_commits"
version = "2.1.0"
version_files = ["pyproject.toml:^version"]
tag_format = "kubernetes-v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"

[tool.ruff]
extend = "../../pyproject.toml"
line-length = 120

[tool.uv.build-backend]
module-name = "kubernetes_provider"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"
