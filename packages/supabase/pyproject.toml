[project]
name = "pragmatiks-supabase"
version = "6.2.6"
description = "Manage Supabase projects and configuration through declarative resources using the Management API."
keywords = ["supabase", "database", "authentication", "backend-as-a-service"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pragmatiks-sdk>=19.0.0",
    "httpx>=0.28.0",
]

authors = [
    { name = "Pragmatiks", email = "team@pragmatiks.io" },
]

[dependency-groups]
dev = [
    "ruff==0.16.8",
    "ty==0.0.63",
]

[project.entry-points."pragma.provider"]
supabase = "supabase_provider"

[tool.commitizen]
name = "cz_conventional_commits"
version = "6.2.6"
version_files = ["pyproject.toml:^version"]
tag_format = "supabase-v$version"
bump_message = "bump: version $current_version → $new_version [skip ci]"

[tool.ruff]
extend = "../../pyproject.toml"
line-length = 120

[tool.uv.build-backend]
module-name = "supabase_provider"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"
