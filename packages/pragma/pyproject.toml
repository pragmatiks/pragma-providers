[project]
name = "pragmatiks-pragma"
version = "8.1.0"
description = "Manage platform-native secrets, configuration, and file storage declaratively through Pragmatiks."
keywords = ["platform", "secrets", "configuration", "files"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pragmatiks-sdk>=33.0.0,<34",
    "httpx>=0.28.0",
]

authors = [
    { name = "Pragmatiks", email = "team@pragmatiks.io" },
]

[dependency-groups]
dev = [
    "ruff==0.16.8",
    "ty==0.0.63",
]

[project.entry-points."pragma.provider"]
pragma = "pragma_provider"

[tool.commitizen]
name = "cz_conventional_commits"
version = "8.1.0"
version_files = ["pyproject.toml:^version"]
tag_format = "pragma-v$version"
bump_message = "bump: version $current_version → $new_version [skip ci]"

[tool.ruff]
extend = "../../pyproject.toml"
line-length = 120

[tool.uv.build-backend]
module-name = "pragma_provider"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
