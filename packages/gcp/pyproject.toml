[project]
name = "pragmatiks-gcp"
version = "7.2.1"
description = "Manage GCP resources including Cloud SQL databases, GKE clusters, and secrets through declarative configuration."
keywords = ["cloud", "gcp", "infrastructure", "database", "kubernetes"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pragmatiks-sdk>=16.0.0",
    "google-cloud-container>=2.50.0",
    "google-cloud-logging>=3.10.0",
    "google-cloud-secret-manager>=2.20.0",
    "google-api-python-client>=2.150.0",
    "google-auth>=2.35.0",
]

authors = [
    { name = "Pragmatiks", email = "team@pragmatiks.io" },
]

[dependency-groups]
dev = [
    "ruff==0.16.8",
    "ty==0.0.63",
]

[project.entry-points."pragma.provider"]
gcp = "gcp_provider"

[tool.commitizen]
name = "cz_conventional_commits"
version = "7.2.1"
version_files = ["pyproject.toml:^version"]
tag_format = "gcp-v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"

[tool.ruff]
extend = "../../pyproject.toml"
line-length = 120

[tool.uv.build-backend]
module-name = "gcp_provider"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"
