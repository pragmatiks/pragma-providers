[project]
name = "pragmatiks-agno"
version = "2.2.0"
description = "Build and deploy AI agents, teams, and knowledge bases with models from OpenAI and Anthropic, MCP tools, and vector storage."
keywords = ["ai", "agents", "llm", "openai", "anthropic", "knowledge-base"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pragmatiks-sdk>=16.0.0",
    "pragmatiks-kubernetes>=2.0.1",
    "agno[anthropic,openai,postgres,qdrant]>=2.4.0",
    "fastapi[standard]>=0.115.0",
    "sqlalchemy>=2.0.0",
    "mcp>=1.26.0",
    "ddgs>=8.0.0",
    "psycopg[binary]>=3.0.0",
]

authors = [
    { name = "Pragmatiks", email = "team@pragmatiks.io" },
]

[dependency-groups]
dev = [
    "ruff==0.16.8",
    "ty==0.0.63",
]

[project.entry-points."pragma.provider"]
agno = "agno_provider"

[project.entry-points."pragma.embeds"]
pragmatiks-gcp = "gcp_provider"
pragmatiks-kubernetes = "kubernetes_provider"

[tool.commitizen]
name = "cz_conventional_commits"
version = "2.2.0"
version_files = ["pyproject.toml:^version"]
tag_format = "agno-v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"

[tool.ruff]
extend = "../../pyproject.toml"
line-length = 120

[tool.uv.sources]
pragmatiks-kubernetes = { workspace = true }

[tool.uv.build-backend]
module-name = "agno_provider"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"
