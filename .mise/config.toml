[task_templates.bash]
shell = "bash -euo pipefail -c"

[task_templates.provider-format]
shell = "bash -euo pipefail -c"
run = '''"$MISE_CONFIG_ROOT/scripts/tasks/run_in_provider_environment.sh" ruff format .'''

[task_templates.provider-check]
shell = "bash -euo pipefail -c"
run = [
  '''"$MISE_CONFIG_ROOT/scripts/tasks/run_in_provider_environment.sh" ruff check --fix .''',
  '''"$MISE_CONFIG_ROOT/scripts/tasks/run_in_provider_environment.sh" ty check''',
]
