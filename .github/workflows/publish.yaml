name: Publish Providers

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      allow_no_commit:
        description: "Bump every provider as a PATCH, even when feat or breaking commits call for MINOR or MAJOR or no commit on its paths is eligible; recovers after a Pragmatiks catalog reset. Ignored when publish_only is set"
        type: boolean
        required: false
        default: false
      publish_only:
        description: "Skip bump, tag and push; re-publish every provider's current version from its release tag to the Pragmatiks registry"
        type: boolean
        required: false
        default: false

concurrency:
  group: pragma-providers-release
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      gcp_version: ${{ steps.bump.outputs.gcp_version }}
      gcp_commit: ${{ steps.bump.outputs.gcp_commit }}
      supabase_version: ${{ steps.bump.outputs.supabase_version }}
      supabase_commit: ${{ steps.bump.outputs.supabase_commit }}
      vercel_version: ${{ steps.bump.outputs.vercel_version }}
      vercel_commit: ${{ steps.bump.outputs.vercel_commit }}
      github_version: ${{ steps.bump.outputs.github_version }}
      github_commit: ${{ steps.bump.outputs.github_commit }}
      pragma_version: ${{ steps.bump.outputs.pragma_version }}
      pragma_commit: ${{ steps.bump.outputs.pragma_commit }}
      kubernetes_version: ${{ steps.bump.outputs.kubernetes_version }}
      kubernetes_commit: ${{ steps.bump.outputs.kubernetes_commit }}
      qdrant_version: ${{ steps.bump.outputs.qdrant_version }}
      qdrant_commit: ${{ steps.bump.outputs.qdrant_commit }}
      agno_version: ${{ steps.bump.outputs.agno_version }}
      agno_commit: ${{ steps.bump.outputs.agno_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.17
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache: false

      - name: Configure git
        run: |
          git config user.name "pragma-ci-bot[bot]"
          git config user.email "254457222+pragma-ci-bot[bot]@users.noreply.github.com"

      - name: Bump providers and relock
        id: bump
        env:
          PUBLISH_ONLY: ${{ inputs.publish_only == true }}
          ALLOW_NO_COMMIT: ${{ inputs.allow_no_commit == true && inputs.publish_only != true }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/bump_providers.sh "${RUNNER_TEMP}/release.bundle" "${GITHUB_OUTPUT}"

      - name: Upload the release bundle
        if: steps.bump.outputs.bumped == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release.bundle
          if-no-files-found: error
          retention-days: 1

  push:
    needs: [bump]
    if: needs.bump.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - name: Download the release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release-bundle

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-actions: write

      - name: Push main and the release tags
        id: push
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          BUNDLE_PATH: ${{ runner.temp }}/release-bundle/release.bundle
          RELEASE_REPOSITORY: ${{ runner.temp }}/release-repository
          REPOSITORY_URL: https://github.com/${{ github.repository }}.git
          GH_REPO: ${{ github.repository }}
        run: |
          AUTHORIZATION="$(printf 'x-access-token:%s' "${APP_TOKEN}" | base64 -w0)"
          echo "::add-mask::${AUTHORIZATION}"

          git init --quiet --bare "${RELEASE_REPOSITORY}"
          cd "${RELEASE_REPOSITORY}"
          git fetch --quiet "${BUNDLE_PATH}" 'refs/heads/main:refs/heads/main' 'refs/tags/*:refs/tags/*'

          if GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTHORIZATION}" \
            git push --atomic --porcelain "${REPOSITORY_URL}" 'refs/heads/main:refs/heads/main' 'refs/tags/*:refs/tags/*'; then
            echo "pushed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          REMOTE_MAIN="$(GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTHORIZATION}" \
            git ls-remote "${REPOSITORY_URL}" refs/heads/main | cut -f1)"
          if [ -n "${REMOTE_MAIN}" ] && ! git merge-base --is-ancestor "${REMOTE_MAIN}" refs/heads/main 2> /dev/null; then
            GH_TOKEN="${APP_TOKEN}" gh workflow run publish.yaml --ref main
            echo "::notice title=Release::main moved after the bump, so nothing was pushed. Started a new Publish Providers run on main, which bumps from the latest main."
            echo "pushed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "::error title=Release::the push of main and the release tags was rejected; see git's error above"
          exit 1

  publish-gcp:
    needs: [bump, push]
    if: >-
      !cancelled() &&
      needs.bump.result == 'success' &&
      needs.bump.outputs.gcp_version != '' &&
      (needs.push.outputs.pushed == 'true' || needs.bump.outputs.bumped != 'true')
    permissions:
      contents: write
    uses: ./.github/workflows/publish-provider.yaml
    with:
      provider: gcp
      version: ${{ needs.bump.outputs.gcp_version }}
      commit: ${{ needs.bump.outputs.gcp_commit }}
    secrets:
      PRAGMA_PUBLISH_API_KEY: ${{ secrets.PRAGMA_PUBLISH_API_KEY }}

  publish-supabase:
    needs: [bump, push]
    if: >-
      !cancelled() &&
      needs.bump.result == 'success' &&
      needs.bump.outputs.supabase_version != '' &&
      (needs.push.outputs.pushed == 'true' || needs.bump.outputs.bumped != 'true')
    permissions:
      contents: write
    uses: ./.github/workflows/publish-provider.yaml
    with:
      provider: supabase
      version: ${{ needs.bump.outputs.supabase_version }}
      commit: ${{ needs.bump.outputs.supabase_commit }}
    secrets:
      PRAGMA_PUBLISH_API_KEY: ${{ secrets.PRAGMA_PUBLISH_API_KEY }}

  publish-vercel:
    needs: [bump, push]
    if: >-
      !cancelled() &&
      needs.bump.result == 'success' &&
      needs.bump.outputs.vercel_version != '' &&
      (needs.push.outputs.pushed == 'true' || needs.bump.outputs.bumped != 'true')
    permissions:
      contents: write
    uses: ./.github/workflows/publish-provider.yaml
    with:
      provider: vercel
      version: ${{ needs.bump.outputs.vercel_version }}
      commit: ${{ needs.bump.outputs.vercel_commit }}
    secrets:
      PRAGMA_PUBLISH_API_KEY: ${{ secrets.PRAGMA_PUBLISH_API_KEY }}

  publish-github:
    needs: [bump, push]
    if: >-
      !cancelled() &&
      needs.bump.result == 'success' &&
      needs.bump.outputs.github_version != '' &&
      (needs.push.outputs.pushed == 'true' || needs.bump.outputs.bumped != 'true')
    permissions:
      contents: write
    uses: ./.github/workflows/publish-provider.yaml
    with:
      provider: github
      version: ${{ needs.bump.outputs.github_version }}
      commit: ${{ needs.bump.outputs.github_commit }}
    secrets:
      PRAGMA_PUBLISH_API_KEY: ${{ secrets.PRAGMA_PUBLISH_API_KEY }}

  publish-pragma:
    needs: [bump, push]
    if: >-
      !cancelled() &&
      needs.bump.result == 'success' &&
      needs.bump.outputs.pragma_version != '' &&
      (needs.push.outputs.pushed == 'true' || needs.bump.outputs.bumped != 'true')
    permissions:
      contents: write
    uses: ./.github/workflows/publish-provider.yaml
    with:
      provider: pragma
      version: ${{ needs.bump.outputs.pragma_version }}
      commit: ${{ needs.bump.outputs.pragma_commit }}
    secrets:
      PRAGMA_PUBLISH_API_KEY: ${{ secrets.PRAGMA_PUBLISH_API_KEY }}

  publish-kubernetes:
    needs: [bump, push, publish-gcp]
    if: >-
      !cancelled() &&
      needs.bump.result == 'success' &&
      needs.bump.outputs.kubernetes_version != '' &&
      (needs.push.outputs.pushed == 'true' || needs.bump.outputs.bumped != 'true') &&
      (needs.publish-gcp.result == 'success' || needs.publish-gcp.result == 'skipped')
    permissions:
      contents: write
    uses: ./.github/workflows/publish-provider.yaml
    with:
      provider: kubernetes
      version: ${{ needs.bump.outputs.kubernetes_version }}
      commit: ${{ needs.bump.outputs.kubernetes_commit }}
    secrets:
      PRAGMA_PUBLISH_API_KEY: ${{ secrets.PRAGMA_PUBLISH_API_KEY }}

  publish-qdrant:
    needs: [bump, push, publish-kubernetes]
    if: >-
      !cancelled() &&
      needs.bump.result == 'success' &&
      needs.bump.outputs.qdrant_version != '' &&
      (needs.push.outputs.pushed == 'true' || needs.bump.outputs.bumped != 'true') &&
      (needs.publish-kubernetes.result == 'success' || needs.publish-kubernetes.result == 'skipped')
    permissions:
      contents: write
    uses: ./.github/workflows/publish-provider.yaml
    with:
      provider: qdrant
      version: ${{ needs.bump.outputs.qdrant_version }}
      commit: ${{ needs.bump.outputs.qdrant_commit }}
    secrets:
      PRAGMA_PUBLISH_API_KEY: ${{ secrets.PRAGMA_PUBLISH_API_KEY }}

  publish-agno:
    needs: [bump, push, publish-gcp, publish-kubernetes]
    if: >-
      !cancelled() &&
      needs.bump.result == 'success' &&
      needs.bump.outputs.agno_version != '' &&
      (needs.push.outputs.pushed == 'true' || needs.bump.outputs.bumped != 'true') &&
      (needs.publish-gcp.result == 'success' || needs.publish-gcp.result == 'skipped') &&
      (needs.publish-kubernetes.result == 'success' || needs.publish-kubernetes.result == 'skipped')
    permissions:
      contents: write
    uses: ./.github/workflows/publish-provider.yaml
    with:
      provider: agno
      version: ${{ needs.bump.outputs.agno_version }}
      commit: ${{ needs.bump.outputs.agno_commit }}
      create_release: false
    secrets:
      PRAGMA_PUBLISH_API_KEY: ${{ secrets.PRAGMA_PUBLISH_API_KEY }}

  agno-runner-image:
    needs: [bump, publish-agno]
    if: ${{ !cancelled() && needs.publish-agno.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.agno_commit }}
          persist-credentials: false

      - name: Read runner transport version
        id: runner-transport
        run: |
          TRANSPORT=$(grep -E '^LABEL ai\.pragmatiks\.agno-runner\.transport=' packages/agno/runner/Dockerfile \
            | sed -E 's/.*transport="([^"]+)".*/\1/')
          if [ -z "$TRANSPORT" ]; then
            echo "Failed to parse agno-runner transport version from Dockerfile"
            exit 1
          fi
          echo "transport=$TRANSPORT" >> "$GITHUB_OUTPUT"
          echo "Runner transport version: $TRANSPORT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push agno runner image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: packages/agno/runner/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            PROVIDER_VERSION=${{ needs.bump.outputs.agno_version }}
          tags: |
            ghcr.io/pragmatiks/agno-runner:${{ steps.runner-transport.outputs.transport }}
            ghcr.io/pragmatiks/agno-runner:latest

  release-agno:
    needs: [bump, agno-runner-image]
    if: ${{ !cancelled() && needs.agno-runner-image.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-provider.yaml
    with:
      provider: agno
      version: ${{ needs.bump.outputs.agno_version }}
