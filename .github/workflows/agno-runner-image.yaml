name: Agno Runner Image

on:
  pull_request:
    branches:
      - main
    paths:
      - packages/agno/**
      - packages/kubernetes/**
      - packages/gcp/**
      - pyproject.toml
      - uv.lock
      - README.md
      - .github/workflows/agno-runner-image.yaml
  workflow_call:
    inputs:
      version:
        description: "Agno provider version being released; the image is pushed as agno-runner:<version> before the provider publishes, then the transport tag and latest are pointed at it"
        type: string
        required: true
      commit:
        description: "Commit the agno release tag points to; the image is built from it"
        type: string
        required: true

permissions: {}

env:
  IMAGE: ghcr.io/pragmatiks/agno-runner
  DOCKERFILE: packages/agno/runner/Dockerfile
  CACHE_SCOPE: agno-runner

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build agno runner image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Verify the release tag
        env:
          TAG: agno-v${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}.git
        run: |
          TAGGED_COMMIT="$(git ls-remote --tags "${REPOSITORY_URL}" "refs/tags/${TAG}" "refs/tags/${TAG}^{}" \
            | awk -v tag="refs/tags/${TAG}" '$2 == tag { commit = $1 } $2 == tag "^{}" { peeled = $1 } END { print (peeled != "" ? peeled : commit) }')"
          if [ "${TAGGED_COMMIT}" != "${COMMIT}" ]; then
            echo "::error title=Release tag::${TAG} resolves to '${TAGGED_COMMIT}' on GitHub, not to ${COMMIT}"
            exit 1
          fi

      - name: Read runner transport version
        id: runner-transport
        run: |
          TRANSPORT=$(grep -E '^LABEL ai\.pragmatiks\.agno-runner\.transport=' "${DOCKERFILE}" \
            | sed -E 's/.*transport="([^"]+)".*/\1/')
          if [ -z "$TRANSPORT" ]; then
            echo "Failed to parse agno-runner transport version from Dockerfile"
            exit 1
          fi
          echo "transport=$TRANSPORT" >> "$GITHUB_OUTPUT"
          echo "Runner transport version: $TRANSPORT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Look up the version tag
        id: existing
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ERROR_PATH="${RUNNER_TEMP}/inspect.stderr"
          if DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}' 2> "${ERROR_PATH}"); then
            echo "${IMAGE}:${VERSION} exists at ${DIGEST}; not rebuilding"
            echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          elif grep -q ": not found$" "${ERROR_PATH}"; then
            echo "${IMAGE}:${VERSION} does not exist; building it"
          else
            cat "${ERROR_PATH}" >&2
            exit 1
          fi

      - name: Build and push the version tag
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          platforms: linux/amd64
          build-args: |
            PROVIDER_VERSION=${{ inputs.version }}
          tags: ${{ env.IMAGE }}:${{ inputs.version }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}

      - name: Point the transport and latest tags at the version tag
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
          TRANSPORT: ${{ steps.runner-transport.outputs.transport }}
        run: |
          if [ -z "${DIGEST}" ]; then
            echo "No digest for the version tag" >&2
            exit 1
          fi
          docker buildx imagetools create -t "${IMAGE}:${TRANSPORT}" -t "${IMAGE}:latest" "${IMAGE}@${DIGEST}"
