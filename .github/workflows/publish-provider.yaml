name: Publish Provider

on:
  workflow_call:
    inputs:
      provider:
        description: "Provider package directory name under packages/, such as gcp"
        type: string
        required: true
      version:
        description: "Version to publish; the release tag <provider>-v<version> must point at commit"
        type: string
        required: true
      commit:
        description: "Commit the release tag points to; the wheel is built from it"
        type: string
        required: true
      create_release:
        description: "Create the GitHub Release after publishing; false when the caller creates it after later steps"
        type: boolean
        default: true
    secrets:
      PRAGMA_PUBLISH_API_KEY:
        required: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the publishing tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          path: release-tag
          persist-credentials: false

      - name: Verify the release tag
        env:
          TAG: ${{ inputs.provider }}-v${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}.git
        run: |
          TAGGED_COMMIT="$(git ls-remote --tags "${REPOSITORY_URL}" "refs/tags/${TAG}" "refs/tags/${TAG}^{}" \
            | awk -v tag="refs/tags/${TAG}" '$2 == tag { commit = $1 } $2 == tag "^{}" { peeled = $1 } END { print (peeled != "" ? peeled : commit) }')"
          if [ "${TAGGED_COMMIT}" != "${COMMIT}" ]; then
            echo "::error title=Release tag::${TAG} resolves to '${TAGGED_COMMIT}' on GitHub, not to ${COMMIT}"
            exit 1
          fi

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.17
          sha256: fe6dd17e68e09682b31d2e7bb7bb755d22636ac1af5d94621e300f2ca9e9fe8a
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache: false

      - name: Build the wheel from the release commit
        env:
          PROVIDER: ${{ inputs.provider }}
          VERSION: ${{ inputs.version }}
        run: |
          ./scripts/build_provider_wheel.sh "release-tag/packages/${PROVIDER}" "${VERSION}" "${RUNNER_TEMP}/wheels"

      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-wheel-${{ inputs.provider }}
          path: ${{ runner.temp }}/wheels/*.whl
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
    steps:
      - name: Check out the publishing tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          path: release-tag
          persist-credentials: false

      - name: Download the wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provider-wheel-${{ inputs.provider }}
          path: ${{ runner.temp }}/wheels

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.17
          sha256: fe6dd17e68e09682b31d2e7bb7bb755d22636ac1af5d94621e300f2ca9e9fe8a
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache: false

      - name: Write the publish key
        env:
          PRAGMA_PUBLISH_API_KEY: ${{ secrets.PRAGMA_PUBLISH_API_KEY }}
        run: |
          umask 077
          printf '%s' "${PRAGMA_PUBLISH_API_KEY}" > "${RUNNER_TEMP}/pragma-publish-key"

      - name: Publish to the Pragmatiks registry
        env:
          PRAGMA_PUBLISH_API_KEY_FILE: ${{ runner.temp }}/pragma-publish-key
          PROVIDER: ${{ inputs.provider }}
          VERSION: ${{ inputs.version }}
        run: |
          ./scripts/publish_platform_provider.sh "release-tag/packages/${PROVIDER}" "${VERSION}" "${RUNNER_TEMP}/wheels"

      - name: Remove the publish key
        if: always()
        run: rm -f "${RUNNER_TEMP}/pragma-publish-key"

  release:
    needs: [publish]
    if: inputs.create_release
    permissions:
      contents: write
    uses: ./.github/workflows/release-provider.yaml
    with:
      provider: ${{ inputs.provider }}
      version: ${{ inputs.version }}
