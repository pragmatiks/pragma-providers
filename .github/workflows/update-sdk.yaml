name: Update SDK

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "New SDK version (e.g., 0.1.0a2)"
        required: true
        type: string

jobs:
  update-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Python
        run: uv python install 3.13

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update SDK version in all providers
        run: |
          SDK_VERSION="${{ inputs.sdk_version }}"

          for pyproject in packages/*/pyproject.toml templates/provider/template/pyproject.toml.jinja; do
            echo "Updating $pyproject to SDK v${SDK_VERSION}"

            sed -i "s|pragmatiks-sdk>=.*\"|pragmatiks-sdk>=${SDK_VERSION}\"|" "$pyproject"
          done

      - name: Wait for PyPI availability
        run: |
          SDK_VERSION="${{ inputs.sdk_version }}"
          echo "Waiting for pragmatiks-sdk==${SDK_VERSION} on PyPI..."
          for i in $(seq 1 60); do
            if curl -s --max-time 30 "https://pypi.org/pypi/pragmatiks-sdk/json" | python3 -c "import sys,json; versions=json.load(sys.stdin)['releases'].keys(); sys.exit(0 if '${SDK_VERSION}' in versions else 1)" 2>/dev/null; then
              echo "Found pragmatiks-sdk==${SDK_VERSION} on PyPI"
              exit 0
            fi
            echo "Attempt ${i}/60: not yet available, waiting 10s..."
            sleep 10
          done
          echo "Timed out waiting for pragmatiks-sdk==${SDK_VERSION}"
          exit 1

      - name: Update lockfile
        run: uv lock --upgrade

      - name: Commit and push branch
        run: |
          SDK_VERSION="${{ inputs.sdk_version }}"
          BRANCH="fix/update-sdk-${SDK_VERSION}"

          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "skip_pr=true" >> "$GITHUB_ENV"
          else
            git checkout -b "$BRANCH"
            git commit -m "fix(deps): update pragmatiks-sdk to v${SDK_VERSION}"
            git push -u origin "$BRANCH"
          fi

      - name: Create and merge PR
        if: env.skip_pr != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SDK_VERSION="${{ inputs.sdk_version }}"
          gh pr create \
            --title "fix(deps): update pragmatiks-sdk to v${SDK_VERSION}" \
            --body "Automated SDK version bump to \`v${SDK_VERSION}\`."
          gh pr merge --squash
