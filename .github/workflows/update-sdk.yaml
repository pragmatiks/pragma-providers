name: Update SDK

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "New SDK version (e.g., 0.1.0a2)"
        required: true
        type: string

permissions: {}

jobs:
  update-sdk:
    runs-on: ubuntu-latest
    env:
      SDK_VERSION: ${{ inputs.sdk_version }}
    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Validate the SDK version
        run: |
          if [[ ! "${SDK_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error title=Update SDK::sdk_version '${SDK_VERSION}' is not a release version such as 18.0.0 or 0.1.0a2"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.17
          sha256: fe6dd17e68e09682b31d2e7bb7bb755d22636ac1af5d94621e300f2ca9e9fe8a
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compare the SDK major with the locked one
        id: major
        run: |
          LOCKED_SDK_VERSION=$(python3 -c 'import tomllib; lock = tomllib.load(open("uv.lock", "rb")); print(next(package["version"] for package in lock["package"] if package["name"] == "pragmatiks-sdk"))')
          echo "locked=${LOCKED_SDK_VERSION}" >> "$GITHUB_OUTPUT"

          if [ "${SDK_VERSION%%.*}" = "${LOCKED_SDK_VERSION%%.*}" ]; then
            echo "crosses=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Update SDK::pragmatiks-sdk ${LOCKED_SDK_VERSION} to ${SDK_VERSION} crosses a major version; the pull request waits for review"
            echo "crosses=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update SDK version in all providers
        run: |
          for pyproject in packages/*/pyproject.toml templates/provider/template/pyproject.toml.jinja; do
            echo "Updating $pyproject to SDK v${SDK_VERSION}"

            sed -i "s|pragmatiks-sdk>=.*\"|pragmatiks-sdk>=${SDK_VERSION}\"|" "$pyproject"
          done

      - name: Wait for PyPI availability
        run: |
          echo "Waiting for pragmatiks-sdk==${SDK_VERSION} on PyPI..."
          for i in $(seq 1 60); do
            if curl -s --max-time 30 "https://pypi.org/pypi/pragmatiks-sdk/json" | python3 -c "import os,sys,json; versions=json.load(sys.stdin)['releases'].keys(); sys.exit(0 if os.environ['SDK_VERSION'] in versions else 1)" 2>/dev/null; then
              echo "Found pragmatiks-sdk==${SDK_VERSION} on PyPI"
              exit 0
            fi
            echo "Attempt ${i}/60: not yet available, waiting 10s..."
            sleep 10
          done
          echo "Timed out waiting for pragmatiks-sdk==${SDK_VERSION}"
          exit 1

      - name: Update lockfile
        run: uv lock --upgrade-package pragmatiks-sdk

      - name: Run the CI gate against the new SDK
        run: mise run check:ci

      - name: Commit and push branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="fix/update-sdk-${SDK_VERSION}"

          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "skip_pr=true" >> "$GITHUB_ENV"
          else
            AUTHORIZATION="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
            echo "::add-mask::${AUTHORIZATION}"
            git checkout -b "$BRANCH"
            git commit -m "fix(deps): update pragmatiks-sdk to v${SDK_VERSION}"
            GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTHORIZATION}" \
              git push -u origin "$BRANCH"
          fi

      - name: Create PR
        if: env.skip_pr != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCKED_SDK_VERSION: ${{ steps.major.outputs.locked }}
          CROSSES_MAJOR: ${{ steps.major.outputs.crosses }}
        run: |
          BODY="Automated SDK version bump to \`v${SDK_VERSION}\`."
          if [ "$CROSSES_MAJOR" = "true" ]; then
            BODY="${BODY}

          SDK major bump from \`${LOCKED_SDK_VERSION}\`: this pull request waits for review. Adapt each provider on this branch, one commit per provider, run \`mise run check\`, then merge it; the merge starts \`publish.yaml\`."
          fi

          gh pr create \
            --title "fix(deps): update pragmatiks-sdk to v${SDK_VERSION}" \
            --body "$BODY"

      - name: Merge PR and start the release
        if: env.skip_pr != 'true' && steps.major.outputs.crosses == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "fix/update-sdk-${SDK_VERSION}" --squash
          gh workflow run publish.yaml --ref main
