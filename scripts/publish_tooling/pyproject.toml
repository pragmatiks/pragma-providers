[project]
name = "pragmatiks-publish-tooling"
version = "0.0.0"
description = "Hash-locked pragma CLI and uv_build backend that provider publishing installs."
requires-python = ">=3.13"
dependencies = ["pragmatiks-cli==17.10.0"]

[dependency-groups]
build = ["uv-build==0.12.20"]

[tool.uv]
package = false
required-version = "==0.12.20"
default-groups = []
